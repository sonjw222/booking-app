name: Test

on:
  # push는 main만 대상으로 한다(merge 이후 최종 확인용). 어떤 브랜치든 열려 있는 PR이 있으면
  # pull_request 이벤트가 이미 그 브랜치를 검증하므로, push.branches를 "**"로 두면 같은 커밋에
  # 대해 push + pull_request 두 워크플로가 동시에 실행된다 — 둘 다 같은 실제 개발용 Supabase에
  # 같은 TEST_USER_A 등 공유 테스트 계정/데이터로 접근하므로, 두 실행이 겹치면 한쪽이 만든
  # membership을 다른 쪽의 "생성 전/후 개수" assertion이 우연히 관측해 실패하는 식의 진짜
  # 데이터 경합이 생길 수 있다(TEST-001 조사에서 실제로 재현됨). PR 없이 로컬에서 곧장 main에
  # push하는 경우는 드물고, 그 경우엔 push 실행만 돈다.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 저장소 전체(브랜치/PR 무관)에서 이 워크플로우를 단 하나만 동시에 돌게 한다.
# 통합 테스트가 여러 브랜치/세션에서 동시에 실행돼도 전부 같은 공유 개발용 Supabase의
# 같은 테스트 계정/센터에 접근하므로, 서로 다른 브랜치 간 실행이 겹쳐도 서로의 데이터
# 변경을 관측해 flaky해지는 문제가 실제로 반복 재현됐다(2026-08-14, 여러 세션이 동시에
# CI를 트리거하며 관측). group을 고정 문자열로 둬서 브랜치/PR과 무관하게 전역 큐 하나로
# 묶고, cancel-in-progress는 false로 둔다 — 다른 브랜치의 정상 진행 중인 실행을 내
# push가 취소시키면 안 되므로(취소 대신 대기). 같은 브랜치/PR에 짧게 여러 번 push한
# 경우의 "최신 것만 남기기"는 더 이상 이 그룹에서 자동으로 되지 않지만, 이건 전역
# 순차 실행이라는 목표와 상충해 감수한다(필요하면 각자 gh run cancel로 직접 정리).
concurrency:
  group: shared-live-supabase-tests
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E tests (Playwright, live dev Supabase)
    runs-on: ubuntu-latest
    # 멈춘(hung) job이 GitHub 기본 360분 제한까지 전역 concurrency 큐를 막는 사고가
    # 실제로 반복됐다(2026-08-14/15, 12시간·25시간+ 멈춘 run이 뒤 대기열 전체를 정지시킴).
    # [2026-08-23] E2E 스위트가 여러 세션이 계속 테스트를 추가하며 자라 정상 실행도 20분
    # 근처에 걸리게 됐다 — PR #86에서 정상 실행 2회가 연속으로 `timeout-minutes: 20`에
    # 걸려 cancelled됐음을 실측 확인(20분 15초, 20분 6초). integration job이 같은 이유로
    # 20→35로 상향된 전례(P2-27, docs/TODO.md)와 동일하게 조정.
    timeout-minutes: 30
    # Low-Egress Fix Batch(2026-09-11) — push(main)는 항상 직전에 병합된 PR이 pull_request로
    # 이미 이 스위트 전체를 돌린 같은 코드(merge commit이라 SHA만 다름)라, push에서 또
    # 돌리면 매 merge마다 라이브 dev Supabase에 똑같은 E2E/통합 테스트를 두 번 태우는
    # 셈이었다(9/15까지 Supabase Free Plan Egress 절약 필요, PostgREST Egress Audit
    # 참고). push에서는 이 job(E2E, 라이브 DB 사용)을 건너뛰고 unit/build만 돈다 — PR
    # 없이 곧장 main에 push하는 드문 경로에서도 build/typecheck는 여전히 걸리므로
    # 검증이 완전히 사라지지는 않는다. pull_request/workflow_dispatch는 기존과 동일하게
    # 항상 전체 스위트가 돈다.
    #
    # unit/integration과 마찬가지로 fork PR은 Secrets가 없어 애초에 통과할 수 없고, 있어도
    # 노출시키면 안 되므로 막는다.
    if: >
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_CENTER_ID: ${{ secrets.TEST_CENTER_ID }}
          TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
          TEST_MANAGER_A_EMAIL: ${{ secrets.TEST_MANAGER_A_EMAIL }}
          TEST_MANAGER_A_PASSWORD: ${{ secrets.TEST_MANAGER_A_PASSWORD }}
          TEST_MANAGER_B_EMAIL: ${{ secrets.TEST_MANAGER_B_EMAIL }}
          TEST_MANAGER_B_PASSWORD: ${{ secrets.TEST_MANAGER_B_PASSWORD }}
          TEST_STAFF_A_EMAIL: ${{ secrets.TEST_STAFF_A_EMAIL }}
          TEST_STAFF_A_PASSWORD: ${{ secrets.TEST_STAFF_A_PASSWORD }}
          TEST_STAFF_B_EMAIL: ${{ secrets.TEST_STAFF_B_EMAIL }}
          TEST_STAFF_B_PASSWORD: ${{ secrets.TEST_STAFF_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 실패 시 스크린샷/Trace/Video(test-results/)와 HTML Report(playwright-report/)를
      # 아티팩트로 남긴다 — 성공 시에도 HTML Report는 남겨 결과를 바로 열어볼 수 있게 한다.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  unit:
    name: Unit tests (no Supabase needed)
    runs-on: ubuntu-latest
    # e2e 이후에 실행 — e2e와 integration이 동시에 돌면 둘 다 같은 공유 테스트 계정/센터의
    # center_settings·classes를 동시에 바꿔 서로의 "저장 전/후 값" assertion을 깨뜨린다
    # (실제로 재현됨: e2e가 병렬로 돌자 operational-settings-wiring/reservation-cancel-grace-period가
    # 실패). unit 자체는 Supabase가 필요 없지만, 여기서 순서를 강제해 e2e → unit → integration →
    # build 전체가 항상 순차 실행되게 한다.
    #
    # Low-Egress Fix Batch — push에서는 e2e가 위 job 자체에서 건너뛰어진다(skipped).
    # needs만 두면 GitHub Actions 기본 동작상 필요한 job이 skipped여도 이 job까지 같이
    # skipped 처리되므로, e2e가 성공했거나 push라서 건너뛰어진 경우 둘 다 이어서 돌도록
    # 명시적으로 조건을 준다. "e2e가 skipped면 무조건 진행"이 아니라 push일 때로 좁힌
    # 이유 — e2e가 fork PR이라 skipped된 경우(원래 동작)까지 진행시키면 안 되기
    # 때문이다(fork는 Secrets가 없어 build 등 뒷단이 그대로 실패함, 예전엔 cascade로
    # 전부 자동 skip됐던 것 — 그 동작을 그대로 유지).
    needs: e2e
    if: always() && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && github.event_name == 'push'))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 22+ 필수: @supabase/supabase-js(realtime-js)가 클라이언트 생성 시 native
      # WebSocket 전역 객체를 요구함. Node 20에는 없어서 "PaymentProviderFactory.test.ts"처럼
      # lib/supabaseClient.ts를 (mock 없이) 실제로 import하는 테스트가 import 단계에서
      # 바로 실패한다 — 20으로 내리지 말 것.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  integration:
    name: Integration tests (live dev Supabase)
    runs-on: ubuntu-latest
    needs: unit
    # 20분으로는 통합 테스트 스위트가 계속 늘어나며 정상 실행도 종종 잘렸다(PR #66, #67
    # 모두 19분대에 timeout으로 cancelled — 실패가 아니라 시간 부족). timeout 자체를
    # 없애면 2026-08-14/15처럼 진짜 멈춘 job이 전역 큐를 몇 시간씩 막는 사고가 재발하므로,
    # 없애는 대신 정상 실행 기록(과거 30~34분)을 감안해 35분으로 늘린다.
    timeout-minutes: 35
    # workflow_dispatch에서는 항상 실행.
    # pull_request에서는 "같은 저장소 브랜치 간" PR일 때만 실행 — fork에서 온 PR은
    # GitHub이 Secrets를 주입하지 않아 애초에 통과할 수 없고, 주입되더라도 남의 fork에
    # 우리 Secrets를 노출시키면 안 되므로 명시적으로 막는다.
    # 이 조건 덕분에 "feature 브랜치 → PR" 단계에서도(merge 전) 통합 테스트가 돌아
    # PR 자체가 검증 게이트 역할을 한다 — 이전 버전은 pull_request를 전부 건너뛰어
    # merge 이후(push to main)에야 실행됐던 문제를 수정함.
    #
    # Low-Egress Fix Batch — push(main)에서는 e2e와 마찬가지로 건너뛴다(라이브 DB 통합
    # 테스트, 바로 위 e2e job의 주석과 동일한 이유 — 직전 PR의 pull_request 실행이 이미
    # 같은 코드를 검증했음). unit은 push에서도 항상 돌므로 needs: unit 자체는 그대로 둔다.
    if: >
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_CENTER_ID: ${{ secrets.TEST_CENTER_ID }}
          TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
          TEST_MANAGER_A_EMAIL: ${{ secrets.TEST_MANAGER_A_EMAIL }}
          TEST_MANAGER_A_PASSWORD: ${{ secrets.TEST_MANAGER_A_PASSWORD }}
          TEST_MANAGER_B_EMAIL: ${{ secrets.TEST_MANAGER_B_EMAIL }}
          TEST_MANAGER_B_PASSWORD: ${{ secrets.TEST_MANAGER_B_PASSWORD }}
          TEST_STAFF_A_EMAIL: ${{ secrets.TEST_STAFF_A_EMAIL }}
          TEST_STAFF_A_PASSWORD: ${{ secrets.TEST_STAFF_A_PASSWORD }}
          TEST_STAFF_B_EMAIL: ${{ secrets.TEST_STAFF_B_EMAIL }}
          TEST_STAFF_B_PASSWORD: ${{ secrets.TEST_STAFF_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build:
    name: Build (production, typecheck 포함)
    runs-on: ubuntu-latest
    # Low-Egress Fix Batch — push에서는 integration이 skipped되므로(위 job 참고),
    # unit job과 동일한 이유(+동일한 fork-PR 예외 처리)로 "성공했거나 push라서
    # 건너뛰어졌으면 계속 진행" 조건을 둔다. push에서도 build(typecheck 포함)는 항상
    # 돌아야 main 직접 push 경로의 검증이 완전히 사라지지 않는다.
    needs: integration
    if: always() && (needs.integration.result == 'success' || (needs.integration.result == 'skipped' && github.event_name == 'push'))
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
