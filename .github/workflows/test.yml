name: Test

on:
  # push는 main만 대상으로 한다(merge 이후 최종 확인용). 열려 있는 PR 이 있으면 pull_request 이벤트가 이미 그 브랜치를 검증하므로 push.branches 를 "**"로 두지 않는다
  # (같은 커밋에 push + pull_request 두 실행이 생겨 CI 시간만 중복된다). live E2E/Integration 은 실행마다 자기 러너 안의 일회용 Supabase 스택을 쓰므로(공유 DEV·Secrets 없음)
  # 서로의 데이터에 영향을 주지 않는다.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 같은 PR/브랜치의 이전 실행은 새 push 가 오면 취소한다(최신 HEAD 만 검증). live 테스트는 실행마다 독립된 일회용 Supabase 스택을 쓰므로 서로 다른 PR 의 실행을 직렬화할 필요가 없다 —
# 예전의 전역 큐(shared-live-supabase-tests)는 모든 실행이 하나뿐인 공유 DEV 를 쓰던 때의 보호 장치였다.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 최소 권한(2026-10-07): 이 workflow의 어떤 job도 repository에 쓰지 않는다. 저장소 기본값도 read지만 명시해 둔다.
permissions:
  contents: read

jobs:
  # ── live 테스트의 격리(#240) ────────────────────────────────────────────────────────
  # E2E 4구간과 Integration 은 각각 자기 러너 안에서 일회용 Supabase 전체 스택(Auth·PostgREST·Storage·Realtime·Edge Functions)을 띄운다(.github/actions/isolated-supabase).
  #  · 이 workflow 의 어떤 job 도 GitHub Secrets 를 읽지 않는다 → 공유 DEV·Production 으로 가는 경로가 없다(tests/unit/ciLiveTestWorkflow.contract.test.ts 가 정적으로 고정).
  #  · 가드(scripts/ci/isolatedTargetGuard.mjs)가 OK(kind=ephemeral-local-stack)가 아니면 테스트 단계는 시작되지 않고 job 은 실패한다. 설정이 없다는 이유로 skip 하거나 통과시키지 않는다.
  #  · baseline 은 공유 DEV public 스키마의 스키마-only 덤프(+ Storage 정책·카탈로그 시드, 데이터 복사 없음)이고, 테스트 계정·센터·상품은 실행마다 새로 만든 뒤 job 이 끝나면 스택째 사라진다.
  #  · 각 구간은 --max-failures=1(같은 환경 문제로 수십 개가 1분씩 timeout 나는 것 방지, 재시도 1회는 유지)로 첫 실패에서 멈춘다. 구간끼리 데이터를 공유하지 않으므로 needs 체인 없이 병렬로 돈다.
  #  · artifact(trace/video/report)는 retention 3일 — 이 저장소는 PUBLIC이라 artifact가 로그인한 누구에게나 내려받기 가능하다. 구간 step은 job timeout보다 짧은 step timeout을 가져 artifact upload(if: always())가 실행된다.
  #  · 모든 spec이 정확히 한 구간에 들어가는지는 tests/unit/ciLiveTestWorkflow.contract.test.ts가 정적으로 검증한다.
  #  · 이 스택은 호스팅 Supabase 프로젝트가 아니라 CLI 가 띄우는 로컬 스택이다(같은 GoTrue/PostgREST/Storage/Realtime/Edge Runtime 이미지). 호스팅 환경 고유 차이는 docs/CI_ISOLATION_240.md 참고.
  e2e-1-auth-attendance:
    name: E2E 1/4 — auth + attendance(첫 실패 지점 우선 확인) (Playwright, isolated Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 기존 실행 조건 유지: push 제외, fork PR 제외(같은 저장소 PR·수동 실행만). 이제 Secrets 가 필요 없어 fork 도 안전하지만 실행 범위를 넓히지 않는다.
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Isolated Supabase (ephemeral local stack — no shared DEV, no secrets)
        uses: ./.github/actions/isolated-supabase
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-1-auth-attendance
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/auth/ tests/e2e/admin/attendance\.spec
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-auth-attendance
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-auth-attendance
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop the isolated stack (always; nothing persists)
        if: always()
        run: supabase stop --no-backup --workdir isolated-supabase

  e2e-2-admin-config:
    name: E2E 2/4 — admin 설정류(허용 상품·휴무일·예약조건·반복수업) (Playwright, isolated Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 기존 실행 조건 유지(push·fork PR 제외)
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Isolated Supabase (ephemeral local stack — no shared DEV, no secrets)
        uses: ./.github/actions/isolated-supabase
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-2-admin-config
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/admin/class-allowed-products tests/e2e/admin/holiday-restores-classes tests/e2e/admin/membership-schedule-rules tests/e2e/admin/recurring-class-per-day-atomicity
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-admin-config
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-admin-config
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop the isolated stack (always; nothing persists)
        if: always()
        run: supabase stop --no-backup --workdir isolated-supabase

  e2e-3-class-reservation-checkout:
    name: E2E 3/4 — 새 수업 생성 + 예약 + 결제 (Playwright, isolated Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 기존 실행 조건 유지(push·fork PR 제외)
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Isolated Supabase (ephemeral local stack — no shared DEV, no secrets)
        uses: ./.github/actions/isolated-supabase
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-3-class-reservation-checkout
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/admin/new-class-creation tests/e2e/reservation/ tests/e2e/checkout/
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-class-reservation-checkout
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-class-reservation-checkout
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop the isolated stack (always; nothing persists)
        if: always()
        run: supabase stop --no-backup --workdir isolated-supabase

  e2e-4-settings-readiness:
    name: E2E 4/4 — 예약 설정 + production-readiness (Playwright, isolated Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 기존 실행 조건 유지(push·fork PR 제외)
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Isolated Supabase (ephemeral local stack — no shared DEV, no secrets)
        uses: ./.github/actions/isolated-supabase
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-4-settings-readiness
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/settings/ tests/e2e/production-readiness/
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-settings-readiness
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-settings-readiness
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop the isolated stack (always; nothing persists)
        if: always()
        run: supabase stop --no-backup --workdir isolated-supabase

  sql:
    name: SQL regression tests (isolated PGlite, no network DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sql

  lint:
    name: Lint (no new diagnostics; existing debt recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests (no Supabase needed — E2E와 독립)
    runs-on: ubuntu-latest
    # e2e 이후에 실행 — e2e와 integration이 동시에 돌면 둘 다 같은 공유 테스트 계정/센터의
    # center_settings·classes를 동시에 바꿔 서로의 "저장 전/후 값" assertion을 깨뜨린다
    # (실제로 재현됨: e2e가 병렬로 돌자 operational-settings-wiring/reservation-cancel-grace-period가
    # 실패). unit 자체는 Supabase가 필요 없지만, 여기서 순서를 강제해 e2e → unit → integration →
    # build 전체가 항상 순차 실행되게 한다.
    #
    # Low-Egress Fix Batch — push에서는 e2e가 위 job 자체에서 건너뛰어진다(skipped).
    # needs만 두면 GitHub Actions 기본 동작상 필요한 job이 skipped여도 이 job까지 같이
    # skipped 처리되므로, e2e가 성공했거나 push라서 건너뛰어진 경우 둘 다 이어서 돌도록
    # 명시적으로 조건을 준다. "e2e가 skipped면 무조건 진행"이 아니라 push일 때로 좁힌
    # 이유 — e2e가 fork PR이라 skipped된 경우(원래 동작)까지 진행시키면 안 되기
    # 때문이다(fork는 Secrets가 없어 build 등 뒷단이 그대로 실패함, 예전엔 cascade로
    # 전부 자동 skip됐던 것 — 그 동작을 그대로 유지).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 22+ 필수: @supabase/supabase-js(realtime-js)가 클라이언트 생성 시 native
      # WebSocket 전역 객체를 요구함. Node 20에는 없어서 "PaymentProviderFactory.test.ts"처럼
      # lib/supabaseClient.ts를 (mock 없이) 실제로 import하는 테스트가 import 단계에서
      # 바로 실패한다 — 20으로 내리지 말 것.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  integration:
    name: Integration tests (isolated Supabase stack)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # 20분으로는 통합 테스트 스위트가 계속 늘어나며 정상 실행도 종종 잘렸다(PR #66, #67
    # 모두 19분대에 timeout으로 cancelled — 실패가 아니라 시간 부족). timeout 자체를
    # 없애면 진짜 멈춘 job이 runner 를 오래 붙잡는 사고가 재발하므로,
    # 없애는 대신 정상 실행 기록(과거 30~34분)을 감안해 35분으로 늘린다.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Isolated Supabase (ephemeral local stack — no shared DEV, no secrets)
        uses: ./.github/actions/isolated-supabase
      - run: npm ci
      - run: npm run test:integration
      - name: Stop the isolated stack (always; nothing persists)
        if: always()
        run: supabase stop --no-backup --workdir isolated-supabase

  acl-fixture-repeat:
    name: ACL fixture isolated and combined repeat (dev only)
    runs-on: ubuntu-latest
    needs: integration
    if: ${{ !cancelled() && github.head_ref == 'test/acl-fixture-restore-20261012' && needs.integration.result == 'success' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Isolated Supabase (ephemeral local stack — no shared DEV, no secrets)
        uses: ./.github/actions/isolated-supabase
      - run: npm ci
      - name: Repeat isolated and combined fixture checks three times
        shell: bash
        run: |
          for iteration in 1 2 3; do
            npx vitest run --config vitest.integration.config.ts tests/integration/acl-003-permission-read.test.ts
            npx vitest run --config vitest.integration.config.ts tests/integration/admin-assignment-security.test.ts
            npx vitest run --config vitest.integration.config.ts tests/integration/acl-003-permission-read.test.ts tests/integration/admin-assignment-security.test.ts
          done
      - name: Stop the isolated stack (always; nothing persists)
        if: always()
        run: supabase stop --no-backup --workdir isolated-supabase

  build:
    name: Build (production, typecheck 포함 — placeholder env, live DB 미사용)
    runs-on: ubuntu-latest
    # live DB를 쓰지 않으므로(placeholder env, 빌드/typecheck만) E2E/Integration 결과와 독립으로 항상 실행한다 — E2E 실패/timeout이 build 결과를 가리지 않게.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
          NEXT_PUBLIC_PAYMENT_PROVIDER: mock
          NEXT_PUBLIC_BILLING_ENABLED: "false"
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "false"
