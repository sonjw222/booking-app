name: Test

on:
  # push는 main만 대상으로 한다(merge 이후 최종 확인용). 어떤 브랜치든 열려 있는 PR이 있으면
  # pull_request 이벤트가 이미 그 브랜치를 검증하므로, push.branches를 "**"로 두면 같은 커밋에
  # 대해 push + pull_request 두 워크플로가 동시에 실행된다 — 둘 다 같은 실제 개발용 Supabase에
  # 같은 TEST_USER_A 등 공유 테스트 계정/데이터로 접근하므로, 두 실행이 겹치면 한쪽이 만든
  # membership을 다른 쪽의 "생성 전/후 개수" assertion이 우연히 관측해 실패하는 식의 진짜
  # 데이터 경합이 생길 수 있다(TEST-001 조사에서 실제로 재현됨). PR 없이 로컬에서 곧장 main에
  # push하는 경우는 드물고, 그 경우엔 push 실행만 돈다.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 저장소 전체(브랜치/PR 무관)에서 이 워크플로우를 단 하나만 동시에 돌게 한다.
# 통합 테스트가 여러 브랜치/세션에서 동시에 실행돼도 전부 같은 공유 개발용 Supabase의
# 같은 테스트 계정/센터에 접근하므로, 서로 다른 브랜치 간 실행이 겹쳐도 서로의 데이터
# 변경을 관측해 flaky해지는 문제가 실제로 반복 재현됐다(2026-08-14, 여러 세션이 동시에
# CI를 트리거하며 관측). group을 고정 문자열로 둬서 브랜치/PR과 무관하게 전역 큐 하나로
# 묶고, cancel-in-progress는 false로 둔다 — 다른 브랜치의 정상 진행 중인 실행을 내
# push가 취소시키면 안 되므로(취소 대신 대기). 같은 브랜치/PR에 짧게 여러 번 push한
# 경우의 "최신 것만 남기기"는 더 이상 이 그룹에서 자동으로 되지 않지만, 이건 전역
# 순차 실행이라는 목표와 상충해 감수한다(필요하면 각자 gh run cancel로 직접 정리).
concurrency:
  group: shared-live-supabase-tests
  cancel-in-progress: false

jobs:
  # ── E2E checkpoint 체인(2026-10-07) ────────────────────────────────────────────────
  # 이전에는 한 job이 전체 Playwright suite(67 tests, workers 1)를 돌려 30분 timeout이 나면 Unit/Integration/Build가 전부 skipped되고 trace/screenshot artifact도 올라가지 못했다
  # (#166/#167/#169에서 같은 패턴 재현). 구조:
  #  · live dev Supabase를 쓰는 job(E2E 4구간 + Integration)은 needs 체인으로 "항상 한 번에 하나만" 순차 실행한다(같은 TEST_USER/TEST_CENTER 공유). 저장소 전체 concurrency 그룹(shared-live-supabase-tests)도 그대로.
  #  · 각 구간은 --max-failures=1(같은 환경 문제로 수십 개가 1분씩 timeout 나는 것 방지, 재시도 1회는 유지)로 첫 실패에서 멈추고, 앞 구간이 실패해도 다음 구간은 계속 실행해(!cancelled()) 정보를 최대한 모은다.
  #  · 구간 step은 job timeout보다 짧은 step timeout을 가져 job이 강제 종료되기 전에 artifact upload(if: always())가 실행된다. 구간 이름이 artifact 이름에 들어 충돌하지 않는다.
  #  · Unit/Build는 live DB를 쓰지 않으므로 E2E와 독립(needs 없음, fork PR에서도 실행). Build는 placeholder env만 쓴다.
  #  · Production 차단: Playwright(tests/e2e/fixtures/env.ts)와 Integration(tests/integration/loadEnv.ts)이 같은 helper(productionGuard)로 Production project ref를 감지하면 시작 전에 hard fail.
  #  · 모든 spec이 정확히 한 구간에 들어가는지는 tests/unit/ciLiveTestWorkflow.contract.test.ts가 정적으로 검증한다.
  e2e-1-auth-attendance:
    name: E2E 1/4 — auth + attendance(첫 실패 지점 우선 확인) (Playwright, live dev Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # unit/integration과 마찬가지로 fork PR은 Secrets가 없어 애초에 통과할 수 없고, 있어도
    # 노출시키면 안 되므로 막는다.
    if: >
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-1-auth-attendance
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/auth/ tests/e2e/admin/attendance\.spec
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_CENTER_ID: ${{ secrets.TEST_CENTER_ID }}
          TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
          TEST_MANAGER_A_EMAIL: ${{ secrets.TEST_MANAGER_A_EMAIL }}
          TEST_MANAGER_A_PASSWORD: ${{ secrets.TEST_MANAGER_A_PASSWORD }}
          TEST_MANAGER_B_EMAIL: ${{ secrets.TEST_MANAGER_B_EMAIL }}
          TEST_MANAGER_B_PASSWORD: ${{ secrets.TEST_MANAGER_B_PASSWORD }}
          TEST_STAFF_A_EMAIL: ${{ secrets.TEST_STAFF_A_EMAIL }}
          TEST_STAFF_A_PASSWORD: ${{ secrets.TEST_STAFF_A_PASSWORD }}
          TEST_STAFF_B_EMAIL: ${{ secrets.TEST_STAFF_B_EMAIL }}
          TEST_STAFF_B_PASSWORD: ${{ secrets.TEST_STAFF_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-auth-attendance
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-auth-attendance
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-2-admin-config:
    name: E2E 2/4 — admin 설정류(허용 상품·휴무일·예약조건·반복수업) (Playwright, live dev Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-1-auth-attendance
    # 앞 구간이 실패해도 계속(정보 수집), 앞 구간이 skipped(push/fork)면 건너뜀
    if: ${{ !cancelled() && needs.e2e-1-auth-attendance.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-2-admin-config
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/admin/class-allowed-products tests/e2e/admin/holiday-restores-classes tests/e2e/admin/membership-schedule-rules tests/e2e/admin/recurring-class-per-day-atomicity
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_CENTER_ID: ${{ secrets.TEST_CENTER_ID }}
          TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
          TEST_MANAGER_A_EMAIL: ${{ secrets.TEST_MANAGER_A_EMAIL }}
          TEST_MANAGER_A_PASSWORD: ${{ secrets.TEST_MANAGER_A_PASSWORD }}
          TEST_MANAGER_B_EMAIL: ${{ secrets.TEST_MANAGER_B_EMAIL }}
          TEST_MANAGER_B_PASSWORD: ${{ secrets.TEST_MANAGER_B_PASSWORD }}
          TEST_STAFF_A_EMAIL: ${{ secrets.TEST_STAFF_A_EMAIL }}
          TEST_STAFF_A_PASSWORD: ${{ secrets.TEST_STAFF_A_PASSWORD }}
          TEST_STAFF_B_EMAIL: ${{ secrets.TEST_STAFF_B_EMAIL }}
          TEST_STAFF_B_PASSWORD: ${{ secrets.TEST_STAFF_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-admin-config
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-admin-config
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-3-class-reservation-checkout:
    name: E2E 3/4 — 새 수업 생성 + 예약 + 결제 (Playwright, live dev Supabase)
    runs-on: ubuntu-latest
