name: Test

on:
  # push는 main만 대상으로 한다(merge 이후 최종 확인용). 어떤 브랜치든 열려 있는 PR이 있으면
  # pull_request 이벤트가 이미 그 브랜치를 검증하므로, push.branches를 "**"로 두면 같은 커밋에
  # 대해 push + pull_request 두 워크플로가 동시에 실행된다 — 둘 다 같은 실제 개발용 Supabase에
  # 같은 TEST_USER_A 등 공유 테스트 계정/데이터로 접근하므로, 두 실행이 겹치면 한쪽이 만든
  # membership을 다른 쪽의 "생성 전/후 개수" assertion이 우연히 관측해 실패하는 식의 진짜
  # 데이터 경합이 생길 수 있다(TEST-001 조사에서 실제로 재현됨). PR 없이 로컬에서 곧장 main에
  # push하는 경우는 드물고, 그 경우엔 push 실행만 돈다.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 같은 PR/브랜치에 대해 이전 실행이 아직 돌고 있으면 취소하고 최신 커밋 것만 남긴다.
# (예: 짧은 시간에 여러 번 push) — 통합 테스트가 공유 테스트 계정으로 실제 개발용 Supabase에
# 접근하므로, 겹쳐 실행되면 서로의 데이터 변경을 관측해 flaky해질 수 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no Supabase needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22+ 필수: @supabase/supabase-js(realtime-js)가 클라이언트 생성 시 native
      # WebSocket 전역 객체를 요구함. Node 20에는 없어서 "PaymentProviderFactory.test.ts"처럼
      # lib/supabaseClient.ts를 (mock 없이) 실제로 import하는 테스트가 import 단계에서
      # 바로 실패한다 — 20으로 내리지 말 것.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  integration:
    name: Integration tests (live dev Supabase)
    runs-on: ubuntu-latest
    needs: unit
    # push/workflow_dispatch에서는 항상 실행.
    # pull_request에서는 "같은 저장소 브랜치 간" PR일 때만 실행 — fork에서 온 PR은
    # GitHub이 Secrets를 주입하지 않아 애초에 통과할 수 없고, 주입되더라도 남의 fork에
    # 우리 Secrets를 노출시키면 안 되므로 명시적으로 막는다.
    # 이 조건 덕분에 "feature 브랜치 → PR" 단계에서도(merge 전) 통합 테스트가 돌아
    # PR 자체가 검증 게이트 역할을 한다 — 이전 버전은 pull_request를 전부 건너뛰어
    # merge 이후(push to main)에야 실행됐던 문제를 수정함.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_CENTER_ID: ${{ secrets.TEST_CENTER_ID }}
          TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
          TEST_MANAGER_A_EMAIL: ${{ secrets.TEST_MANAGER_A_EMAIL }}
          TEST_MANAGER_A_PASSWORD: ${{ secrets.TEST_MANAGER_A_PASSWORD }}
          TEST_MANAGER_B_EMAIL: ${{ secrets.TEST_MANAGER_B_EMAIL }}
          TEST_MANAGER_B_PASSWORD: ${{ secrets.TEST_MANAGER_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
