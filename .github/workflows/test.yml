      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-3-class-reservation-checkout
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/admin/new-class-creation tests/e2e/reservation/ tests/e2e/checkout/
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
          # 즉시 사용" 전제의 기존 테스트가 깨진다(실제로 이 커밋 추가 직후 CI에서 재현됨).
          NEXT_PUBLIC_PG_CHECKOUT_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          TEST_CENTER_ID: ${{ secrets.TEST_CENTER_ID }}
          TEST_PRODUCT_ID: ${{ secrets.TEST_PRODUCT_ID }}
          TEST_MANAGER_A_EMAIL: ${{ secrets.TEST_MANAGER_A_EMAIL }}
          TEST_MANAGER_A_PASSWORD: ${{ secrets.TEST_MANAGER_A_PASSWORD }}
          TEST_MANAGER_B_EMAIL: ${{ secrets.TEST_MANAGER_B_EMAIL }}
          TEST_MANAGER_B_PASSWORD: ${{ secrets.TEST_MANAGER_B_PASSWORD }}
          TEST_STAFF_A_EMAIL: ${{ secrets.TEST_STAFF_A_EMAIL }}
          TEST_STAFF_A_PASSWORD: ${{ secrets.TEST_STAFF_A_PASSWORD }}
          TEST_STAFF_B_EMAIL: ${{ secrets.TEST_STAFF_B_EMAIL }}
          TEST_STAFF_B_PASSWORD: ${{ secrets.TEST_STAFF_B_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-class-reservation-checkout
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-class-reservation-checkout
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-4-settings-readiness:
    name: E2E 4/4 — 예약 설정 + production-readiness (Playwright, live dev Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-3-class-reservation-checkout
    # 앞 구간이 실패해도 계속(정보 수집), 앞 구간이 skipped(push/fork)면 건너뜀
    if: ${{ !cancelled() && needs.e2e-3-class-reservation-checkout.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e-4-settings-readiness
        timeout-minutes: 15
        run: npx playwright test --max-failures=1 auth\.setup\.ts tests/e2e/settings/ tests/e2e/production-readiness/
        env:
          # PG_CHECKOUT_ENABLED는 "실제 서비스 출시 전 결제 기능 잠금"용 게이트라(2026-09-04,
          # lib/payments/PaymentProviderFactory.ts) 프로덕션(Vercel)에서만 꺼둬야 하고, CI는
          # 이 게이트와 무관하게 카드/카카오페이/토스페이/계좌이체(mock provider) 전체 흐름을
          # 계속 검증해야 한다 — 꺼두면 결제수단이 직접결제로 강제 고정되며 즉시 발급되는
          # 수강권이 없어져(직접결제는 pending) new-class-creation.spec.ts 등 "구매 직후
