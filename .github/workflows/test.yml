    needs: e2e-2-admin-config
    # 앞 구간이 실패해도 계속(정보 수집), 앞 구간이 skipped(push/fork)면 건너뜀
    if: ${{ !cancelled() && needs.e2e-2-admin-config.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
