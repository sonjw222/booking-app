name: "[TEMP DEBUG] Supabase project ref 확인"

# PR #49 진단 전용 — DB 접속 없이 CI가 보는 NEXT_PUBLIC_SUPABASE_URL의 project ref
# 앞 8자리만 출력한다(민감정보 아님). 다른 job 없이 단독 실행돼 e2e/unit/integration
# 순차 체인이나 공유 dev DB 경합과 무관하게 즉시 끝난다. 진단 끝나면 이 파일 삭제 예정.
on:
  pull_request:
  workflow_dispatch:

jobs:
  print-ref:
    runs-on: ubuntu-latest
    steps:
      - name: project ref 앞 8자리만 출력(값 자체는 노출 안 함)
        run: |
          REF=$(echo "$NEXT_PUBLIC_SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
          echo "project ref prefix: ${REF:0:8}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
