name: Browser QA worker offline regression
on:
  pull_request:
    paths:
      - 'tools/mwhabit-browser-qa/**'
      - '.github/workflows/browser-qa-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/mwhabit-browser-qa/tests
      - run: python -m py_compile tools/mwhabit-browser-qa/qa_chrome.py
