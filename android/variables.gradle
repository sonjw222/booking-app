ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    // Google 네이티브 로그인(release blocker, 2026-09-15) — Credential Manager는
    // Google 공식 최신 권장 API(예전 play-services-auth GoogleSignInClient는 deprecated).
    // credentials-play-services-auth는 credentials와 버전을 맞춰야 한다(공식 배포 관례).
    androidxCredentialsVersion = '1.5.0'
    googleIdVersion = '1.2.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    // Automated QA Foundation Batch(2026-09-18) — androidx.test.espresso 계열은 같은
    // 릴리스 트레인이라(espresso-core/espresso-web 전부 3.7.0으로 같이 배포됨,
    // dl.google.com maven-metadata.xml로 확인) espresso-web은 별도 변수 없이
    // androidxEspressoCoreVersion을 그대로 재사용한다. uiautomator/test:rules는 각자
    // 다른 버전 체계라 별도 변수로 둔다(전부 dl.google.com maven-metadata.xml 기준
    // 최신 stable 확인함, 추측 안 함).
    androidxTestUiAutomatorVersion = '2.4.0'
    androidxTestRulesVersion = '1.7.0'
    cordovaAndroidVersion = '14.0.1'
}